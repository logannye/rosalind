[package]
name = "rosalind-genomics"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Logan Nye <logannye@users.noreply.github.com>"]
description = "Deterministic, low-memory genomics engine: memory as a verifiable contract (declare → predict → honor → verify) for alignment and variant calling"
repository = "https://github.com/logannye/rosalind"
license = "MIT OR Apache-2.0"
keywords = ["genomics", "alignment", "variant-calling", "bioinformatics", "bwt", "fm-index"]
categories = ["science::bioinformatics", "algorithms"]
readme = "README.md"
documentation = "https://docs.rs/rosalind-genomics"
# Keep the published .crate lean: ship source + licenses, not demo data, artifacts,
# or internal planning docs (all remain in the git repo).
exclude = [
    "results/",
    "docs/superpowers/",
    "docs/findings/",
    "examples/data/",
    "tests/snapshots/",
    ".github/",
]

# Published as `rosalind-genomics` (the bare `rosalind` crate is an unrelated, dormant
# 2016 package). The library and the installed binary are both named `rosalind`, so
# `use rosalind::...` and the `rosalind` CLI are unchanged.
[lib]
name = "rosalind"
path = "src/lib.rs"

[[bin]]
name = "rosalind"
path = "src/main.rs"

[dependencies]
# OS bindings (read-only mmap of large reference/index files; peak-RSS readout)
libc = "0.2"
# Fast hashing for the reproducibility receipts
blake3 = "1.5"
# Transparent gzip/bgzf-sequential decompression for FASTA/FASTQ ingestion
flate2 = "1.0"
# Bit manipulation - compact rank/select bitvectors in the FM-index
bitvec = "1.0"
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4.5", features = ["derive"] }
# BAM/VCF output
rust-htslib = { version = "0.44", default-features = false, features = ["bzip2", "lzma"] }

[dev-dependencies]
proptest = "1.4"

[build-dependencies]
# Same hash as the runtime receipt digests — for deps_lock_blake3 in build.rs.
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
