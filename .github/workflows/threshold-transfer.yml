name: Fresh GIAB recall-constrained threshold transfer

on:
  workflow_dispatch:
  push:
    branches: [codex/hg002-depth-calibration]
    paths:
      - 'research/threshold-transfer/*.py'
      - 'research/threshold-transfer/tests/**'
      - 'research/threshold-transfer/protocol.json'
      - 'research/threshold-transfer/execution-window.json'
      - '.github/workflows/threshold-transfer.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: threshold-transfer-overnight
  cancel-in-progress: false

jobs:
  threshold-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: python
      ROSALIND_BINARY: ${{ github.workspace }}/target/release/rosalind
      ROSALIND_BENCH_BINARY: ${{ github.workspace }}/target/release/rosalind
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Admit bounded user-authorized continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation-results/source-inputs
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'research/threshold-transfer')
          from run import execution_deadline
          root = Path('research/threshold-transfer')
          if datetime.now(timezone.utc) >= execution_deadline(root/'protocol.json', root/'execution-window.json'):
              raise SystemExit('Authorized execution deadline passed; do not start')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('No opaque reruns; continuation requires a recorded new attempt')
          runs = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/logannye/rosalind/actions/workflows/threshold-transfer.yml/runs?branch=codex%2Fhg002-depth-calibration&per_page=100'
          ], text=True))
          window = json.loads((root/'execution-window.json').read_text())
          prior = set(window['completed_prior_run_ids'])
          if not {39901841463, 39902020683, 39991819570}.issubset(prior) or not 3 <= len(prior) <= 4:
              raise SystemExit('Continuation permits at most two new attempts after the preserved three-run history')
          allowed = prior | {int(os.environ['GITHUB_RUN_ID'])}
          if runs['total_count'] != len(allowed) or {r['id'] for r in runs['workflow_runs']} != allowed:
              raise SystemExit('Hosted attempt inventory differs; stop without acquiring or scoring data')
          if any(r['status'] != 'completed' for r in runs['workflow_runs'] if r['id'] in prior):
              raise SystemExit('Prior study compute still active; do not overlap')
          used = 0
          for run_id in sorted(prior):
              jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/logannye/rosalind/actions/runs/{run_id}/jobs'], text=True))
              for job in jobs['jobs']:
                  used += (datetime.fromisoformat(job['completed_at'].replace('Z', '+00:00')) - datetime.fromisoformat(job['started_at'].replace('Z', '+00:00'))).total_seconds()
          if used + 10800 > 21600 or used - 618 + 10800 > 18000:
              raise SystemExit('Insufficient remaining runner budget for the hard per-job limit')
          free = shutil.disk_usage('.').free
          print(f'Free hosted bytes: {free}')
          if free < 12 * (1 << 30):
              raise SystemExit('Insufficient hosted scratch')
          PY
      - name: Install exact model dependency wheels
        run: |
          python -m pip install --only-binary=:all: -r research/evidence-sufficiency/requirements.lock
      - name: Scientific policy, split, labeling and provenance tests
        run: |
          python -m unittest discover -s research/evidence-sufficiency/tests -v 2>&1 | tee validation-results/evidence-study-tests.log
          python -m unittest discover -s research/depth-calibration/tests -v 2>&1 | tee validation-results/calibration-tests.log
          python -m unittest discover -s research/threshold-transfer/tests -v 2>&1 | tee validation-results/threshold-tests.log
      - name: Cheap GIAB metadata preflight before full downloads and native build
        timeout-minutes: 3
        run: |
          python -u research/threshold-transfer/preflight.py \
            --protocol research/threshold-transfer/protocol.json \
            --output validation-results/preflight 2>&1 | tee validation-results/preflight.log
      - name: Hosted native compilation and conformance
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace 2>&1 | tee validation-results/native-tests.log
          cargo build --locked --release --bin rosalind 2>&1 | tee validation-results/native-build.log
      - name: Existing native Python and independent evidence oracles
        run: |
          python -m unittest discover -s python/tests -p 'test_*.py' -v 2>&1 | tee validation-results/python-native-tests.log
          python -m unittest discover -s benchmarks/evidence -p 'test_*.py' -v 2>&1 | tee validation-results/evidence-oracle-tests.log
      - name: Retrieve exact historical source and frozen model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/logannye/rosalind/actions/runs/39879349288 > validation-results/source-inputs/source-run.json
          gh api repos/logannye/rosalind/actions/artifacts/12470695514 > validation-results/source-inputs/source-artifact.json
          gh api repos/logannye/rosalind/actions/artifacts/12470695514/zip > validation-results/source-inputs/source.zip
          gh api repos/logannye/rosalind/actions/runs/39895644473 > validation-results/source-inputs/model-run.json
          gh api repos/logannye/rosalind/actions/artifacts/12476332528 > validation-results/source-inputs/model-artifact.json
          gh api repos/logannye/rosalind/actions/artifacts/12476332528/zip > validation-results/source-inputs/model.zip
      - name: Freeze thresholds using HG002 development evidence only
        timeout-minutes: 20
        run: |
          python -u research/threshold-transfer/run.py --phase freeze \
            --binary "$ROSALIND_BINARY" --inputs validation-results/source-inputs \
            --output validation-results/threshold-transfer 2>&1 | tee validation-results/freeze.log
      - name: Require identical policies and protocol after provenance repair
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          # These bytes were published before acquisition in run 39902020683.
          expected = {
              'frozen-policy.json': '899ee3f34e9c3fb10d04da23d0637d07780b552f23239724c894b980c4ae0dbd',
              'protocol.json': '27cdb262fef4ed2e23f4f78914be766b34cfd89dd5898f4fc270f3bb049e3d1a',
          }
          root = Path('validation-results/threshold-transfer')
          for name, sha in expected.items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != sha:
                  raise SystemExit(f'Frozen bytes changed after execution-only repair: {name}')
          print('Policies and protocol match the pre-acquisition freeze from run 39902020683')
          PY
      - name: Publish immutable threshold freeze before fresh acquisition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threshold-freeze-${{ github.sha }}-${{ github.run_id }}
          path: validation-results/threshold-transfer
          if-no-files-found: error
          retention-days: 30
      - name: Evaluate fresh GIAB data with frozen policies and measure costs
        timeout-minutes: 120
        run: |
          python -u research/threshold-transfer/run.py --phase fresh \
            --binary "$ROSALIND_BINARY" --inputs validation-results/source-inputs \
            --output validation-results/threshold-transfer 2>&1 | tee validation-results/fresh.log
      - name: Publish scientific decision separately from execution status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('validation-results/threshold-transfer')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Fresh HG001 threshold transfer; no base-model refits or selective escalation. Original P0/P1 decisions remain unchanged.\n\n')
              if list(p.glob('failure-*.json')) or not (p/'completion.json').exists():
                  out.write('No valid completed study. Inspect retained failure records and any frozen policy.\n')
              else:
                  report = json.loads((p/'report.json').read_text())
                  out.write('```json\n' + json.dumps(report.get('gate', {}), indent=2) + '\n```\n')
          PY
      - name: Retain results and failure records without raw acquisition scratch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threshold-transfer-${{ github.sha }}-${{ github.run_id }}
          path: |
            validation-results
            !validation-results/source-inputs/**
            !validation-results/preflight/*.bai
            !validation-results/threshold-transfer/fresh/inputs/**
            !validation-results/threshold-transfer/fresh/inputs.hidden-for-replay/**
            !validation-results/threshold-transfer/fresh/preflight/*.bai
          if-no-files-found: error
          retention-days: 30
