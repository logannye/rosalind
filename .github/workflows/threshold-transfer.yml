name: Fresh GIAB recall-constrained threshold transfer

on:
  workflow_dispatch:
  push:
    branches: [codex/hg002-depth-calibration]
    paths:
      - 'research/threshold-transfer/*.py'
      - 'research/threshold-transfer/tests/**'
      - 'research/threshold-transfer/protocol.json'
      - '.github/workflows/threshold-transfer.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: threshold-transfer-overnight
  cancel-in-progress: false

jobs:
  threshold-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: python
      ROSALIND_BINARY: ${{ github.workspace }}/target/release/rosalind
      ROSALIND_BENCH_BINARY: ${{ github.workspace }}/target/release/rosalind
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Admit bounded overnight work
        run: |
          mkdir -p validation-results/source-inputs
          python - <<'PY'
          from datetime import datetime, timezone
          import json, shutil
          from pathlib import Path
          protocol = json.loads(Path('research/threshold-transfer/protocol.json').read_text())
          if datetime.now(timezone.utc) >= datetime.fromisoformat(protocol['deadline_utc'].replace('Z', '+00:00')):
              raise SystemExit('Overnight deadline passed; do not start')
          free = shutil.disk_usage('.').free
          print(f'Free hosted bytes: {free}')
          if free < 12 * (1 << 30):
              raise SystemExit('Insufficient hosted scratch')
          PY
      - name: Install exact model dependency wheels
        run: |
          python -m pip install --only-binary=:all: -r research/evidence-sufficiency/requirements.lock
      - name: Scientific policy, split, labeling and provenance tests
        run: |
          python -m unittest discover -s research/evidence-sufficiency/tests -v 2>&1 | tee validation-results/evidence-study-tests.log
          python -m unittest discover -s research/depth-calibration/tests -v 2>&1 | tee validation-results/calibration-tests.log
          python -m unittest discover -s research/threshold-transfer/tests -v 2>&1 | tee validation-results/threshold-tests.log
      - name: Hosted native compilation and conformance
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace 2>&1 | tee validation-results/native-tests.log
          cargo build --locked --release --bin rosalind 2>&1 | tee validation-results/native-build.log
      - name: Existing native Python and independent evidence oracles
        run: |
          python -m unittest discover -s python/tests -p 'test_*.py' -v 2>&1 | tee validation-results/python-native-tests.log
          python -m unittest discover -s benchmarks/evidence -p 'test_*.py' -v 2>&1 | tee validation-results/evidence-oracle-tests.log
      - name: Retrieve exact historical source and frozen model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/logannye/rosalind/actions/runs/39879349288 > validation-results/source-inputs/source-run.json
          gh api repos/logannye/rosalind/actions/artifacts/12470695514 > validation-results/source-inputs/source-artifact.json
          gh api repos/logannye/rosalind/actions/artifacts/12470695514/zip > validation-results/source-inputs/source.zip
          gh api repos/logannye/rosalind/actions/runs/39895644473 > validation-results/source-inputs/model-run.json
          gh api repos/logannye/rosalind/actions/artifacts/12476332528 > validation-results/source-inputs/model-artifact.json
          gh api repos/logannye/rosalind/actions/artifacts/12476332528/zip > validation-results/source-inputs/model.zip
      - name: Freeze thresholds using HG002 development evidence only
        timeout-minutes: 20
        run: |
          python -u research/threshold-transfer/run.py --phase freeze \
            --binary "$ROSALIND_BINARY" --inputs validation-results/source-inputs \
            --output validation-results/threshold-transfer 2>&1 | tee validation-results/freeze.log
      - name: Publish immutable threshold freeze before fresh acquisition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threshold-freeze-${{ github.sha }}-${{ github.run_id }}
          path: validation-results/threshold-transfer
          if-no-files-found: error
          retention-days: 30
      - name: Evaluate fresh GIAB data with frozen policies and measure costs
        timeout-minutes: 120
        run: |
          python -u research/threshold-transfer/run.py --phase fresh \
            --binary "$ROSALIND_BINARY" --inputs validation-results/source-inputs \
            --output validation-results/threshold-transfer 2>&1 | tee validation-results/fresh.log
      - name: Publish scientific decision separately from execution status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('validation-results/threshold-transfer')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Fresh HG001 threshold transfer; no base-model refits or selective escalation. Original P0/P1 decisions remain unchanged.\n\n')
              if list(p.glob('failure-*.json')) or not (p/'completion.json').exists():
                  out.write('No valid completed study. Inspect retained failure records and any frozen policy.\n')
              else:
                  report = json.loads((p/'report.json').read_text())
                  out.write('```json\n' + json.dumps(report.get('gate', {}), indent=2) + '\n```\n')
          PY
      - name: Retain results and failure records without raw acquisition scratch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threshold-transfer-${{ github.sha }}-${{ github.run_id }}
          path: |
            validation-results
            !validation-results/source-inputs/**
            !validation-results/threshold-transfer/fresh/inputs/**
            !validation-results/threshold-transfer/fresh/inputs.hidden-for-replay/**
          if-no-files-found: error
          retention-days: 30
