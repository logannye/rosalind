name: Python wheels

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit selected by the parent release gate
        type: string
        required: true
      package_version:
        description: Base Cargo version or unique numbered RC version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: 'off'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bind the wheel to its candidate and unique release version
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python scripts/prepare-wheel-version.py --candidate-sha "$CANDIDATE_SHA" --version "$PACKAGE_VERSION" --output "$RUNNER_TEMP/wheel-build.json"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          maturin-version: '1.9.4'
          args: --release --locked --out dist
      # Maturin's Linux compiler and Cargo cache live inside its container. The
      # scaffold smoke compiles on the host and prepares its own Cargo lock/cache.
      - name: Prepare Linux host SDK compiler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libbz2-dev liblzma-dev zlib1g-dev
      - name: Fresh Python 3.11 wheel smoke
        run: scripts/smoke-wheel.sh dist/*.whl --candidate-source "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - name: Fresh minimum-supported Python wheel smoke
        run: scripts/smoke-wheel.sh dist/*.whl --candidate-source "$GITHUB_WORKSPACE"
      - name: Record candidate provenance beside wheel
        run: |
          python3 scripts/wheel-artifacts.py record --directory dist \
            --build-report "$RUNNER_TEMP/wheel-build.json" --target '${{ matrix.target }}' \
            --output 'dist/wheel-build-${{ matrix.target }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
