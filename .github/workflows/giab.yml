name: GIAB v5.0q benchmark

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Intentionally update baseline (requires changelog entry)
        required: false
        default: false
        type: boolean
      happy_image:
        description: Immutable hap.py image (NAME@sha256:DIGEST); defaults to the GIAB_HAPPY_IMAGE repository variable
        required: false
        type: string
  schedule:
    - cron: '17 8 1 * *'

jobs:
  hg002-chr20:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GIAB_HAPPY_IMAGE: ${{ inputs.happy_image || vars.GIAB_HAPPY_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Restore pinned GIAB inputs
        uses: actions/cache@v4
        with:
          path: benchmarks/giab/data
          key: giab-v5.0q-grch38-chr20-${{ hashFiles('benchmarks/giab/resources.tsv') }}
      - name: Prepare inputs
        run: benchmarks/giab/prepare.sh
      - name: Run benchmark
        run: |
          case "$GIAB_HAPPY_IMAGE" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Configure repository variable GIAB_HAPPY_IMAGE or dispatch with an immutable NAME@sha256:DIGEST" >&2; exit 2 ;;
          esac
          if [ "${{ inputs.update_baseline || false }}" = "true" ]; then
            benchmarks/giab/run.sh --update-baseline
          else
            benchmarks/giab/run.sh
          fi
      - name: Upload report and receipt
        uses: actions/upload-artifact@v4
        with:
          name: hg002-v5.0q-grch38-chr20
          path: |
            benchmarks/giab/data/results/latest.json
            benchmarks/giab/data/results/happy/report.json
            benchmarks/giab/data/results/HG002.rosalind.chr20.vcf.manifest.json
