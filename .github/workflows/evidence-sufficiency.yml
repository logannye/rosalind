name: Evidence sufficiency HG002 pilot

on:
  workflow_dispatch:
    inputs:
      run_pilot:
        description: Run the frozen HG002 P0 after correctness checks
        type: boolean
        default: true
  push:
    branches: [codex/evidence-sufficiency-pilot]
    paths:
      - 'research/evidence-sufficiency/*.py'
      - 'research/evidence-sufficiency/tests/**'
      - 'research/evidence-sufficiency/protocol-p0.json'
      - 'research/evidence-sufficiency/requirements.lock'
      - '.github/workflows/evidence-sufficiency.yml'

permissions:
  contents: read

concurrency:
  group: evidence-sufficiency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: python
      ROSALIND_BINARY: ${{ github.workspace }}/target/release/rosalind
      ROSALIND_BENCH_BINARY: ${{ github.workspace }}/target/release/rosalind
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Create failure-preserving log directory
        run: mkdir -p validation-results
      - name: Install locked binary wheels without installing or rebuilding the package
        run: |
          python -m pip install --only-binary=:all: -r research/evidence-sufficiency/requirements.lock
      - name: Hosted native compilation and conformance
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace 2>&1 | tee validation-results/native-tests.log
          cargo build --locked --release --bin rosalind 2>&1 | tee validation-results/native-build.log
      - name: Existing Python native and independent evidence oracle checks
        run: |
          python -m unittest discover -s python/tests -p 'test_*.py' -v 2>&1 | tee validation-results/python-native.log
          python -m unittest discover -s benchmarks/evidence -p 'test_*.py' -v 2>&1 | tee validation-results/evidence-oracle.log
      - name: New scientific split, label, feature, estimator and replay checks
        run: |
          python -c 'import numpy, scipy, sklearn, pysam, pyarrow, psutil, blake3'
          python -m unittest discover -s research/evidence-sufficiency/tests -p 'test_*.py' -v 2>&1 | tee validation-results/pilot-tests.log
      - name: Check available analysis storage
        run: |
          python - <<'PY'
          import shutil
          free = shutil.disk_usage('.').free
          print(f'Free bytes before scientific execution: {free}')
          if free < 12 * (1 << 30):
              raise SystemExit('Insufficient hosted scratch; do not start acquisition')
          PY
      - name: Execute bounded frozen P0 only
        if: github.event_name == 'push' || inputs.run_pilot
        timeout-minutes: 125
        run: |
          python -u research/evidence-sufficiency/run_pilot.py \
            --binary "$ROSALIND_BINARY" \
            --output validation-results/hg002-p0 2>&1 | tee validation-results/pilot.log
      - name: Publish decision to job summary without unlocking P1 implicitly
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('validation-results/hg002-p0/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('P0 feasibility only. P1 requires an explicit checked gate and a separately frozen protocol.\n\n')
              if p.exists():
                  r = json.loads(p.read_text())
                  out.write('```json\n' + json.dumps({k:r[k] for k in ('status','gate','p1_authorized_by_gate')}, indent=2) + '\n```\n')
              else:
                  out.write('No completed scientific report. Inspect retained failure logs.\n')
          PY
      - name: Retain results, saved evidence, exact identities and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-sufficiency-${{ github.sha }}-${{ github.run_id }}
          path: |
            validation-results
            !validation-results/hg002-p0/inputs/**
            !validation-results/hg002-p0/inputs.raw-unavailable/**
          if-no-files-found: warn
          retention-days: 30
