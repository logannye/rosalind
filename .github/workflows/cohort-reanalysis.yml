name: Bounded cohort research validation

on:
  workflow_dispatch:
    inputs:
      run_pilot:
        description: Run the bounded synthetic B/C/D diagnostic pilot after correctness gates
        type: boolean
        default: true
  pull_request:
    paths:
      - 'research/cohort-reanalysis/**'
      - 'src/dataset_cli.rs'
      - 'python/rosalind/dataset.py'
      - 'python/tests/test_dataset_coverage.py'
      - '.github/workflows/cohort-reanalysis.yml'

permissions:
  contents: read

jobs:
  exact-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: python
      ROSALIND_BINARY: ${{ github.workspace }}/target/release/rosalind
      ROSALIND_BENCH_BINARY: ${{ github.workspace }}/target/release/rosalind
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned validation wheels without installing the Rosalind package
        run: |
          python -m pip install --only-binary=:all: -r research/cohort-reanalysis/workloads/requirements.lock
      - name: Format and exact-revision native conformance, replay and CRAM gates
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo build --locked --release --bin rosalind
      - name: Record tested source, native binary and environment identities
        run: |
          mkdir -p validation-results
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, subprocess, sys
          from pathlib import Path
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(1048576), b''):
                      h.update(block)
              return h.hexdigest()
          binary = os.environ['ROSALIND_BINARY']
          report = {'source_revision': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'source_status': subprocess.check_output(['git','status','--porcelain'], text=True),
                    'github_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'binary_sha256': digest(binary), 'cargo_lock_sha256': digest('Cargo.lock'),
                    'binary_version': subprocess.check_output([binary,'--version'], text=True).strip(),
                    'rustc': subprocess.check_output(['rustc','--version','--verbose'], text=True),
                    'python': sys.version, 'platform': platform.platform(),
                    'dependencies': {p: importlib.metadata.version(p) for p in ['pysam','pyarrow','psutil','blake3','numpy']}}
          Path('validation-results/identity.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          PY
      - name: Existing Python native dataset and lifecycle checks
        run: python -m unittest discover -s python/tests -p 'test_*.py' -v 2>&1 | tee validation-results/python-native.log
      - name: Unchanged authored three-specimen oracle
        run: |
          python examples/cohort-reanalysis/prepare.py validation-results/fixture
          python examples/cohort-reanalysis/validate.py validation-results/fixture --binary "$ROSALIND_BINARY"
      - name: Retain three-specimen plan, summary and offline replay walkthrough
        run: |
          python research/cohort-reanalysis/demo.py \
            --prepared validation-results/fixture --binary "$ROSALIND_BINARY" \
            --output validation-results/retained-demo
      - name: New exact reducer, contract and native research lifecycle checks
        run: python -m unittest discover -s research/cohort-reanalysis/tests -p 'test_*.py' -v 2>&1 | tee validation-results/research.log
      - name: Saved-only historical HG002 leaf against retained independent oracle
        run: |
          python research/cohort-reanalysis/archived_real.py \
            --binary "$ROSALIND_BINARY" \
            --output validation-results/archived-hg002
      - name: Relevant independent evidence oracle regressions
        run: python -m unittest discover -s benchmarks/evidence -p 'test_*.py' -v 2>&1 | tee validation-results/evidence-oracle.log
      - name: Small multi-partition B/C/D diagnostic pilot
        if: github.event_name == 'pull_request' || inputs.run_pilot
        run: |
          python research/cohort-reanalysis/benchmark.py \
            --binary "$ROSALIND_BINARY" \
            --config research/cohort-reanalysis/workloads/pilot-v1.json \
            --output validation-results/pilot
      - name: Retain exact-revision validation and all diagnostic failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cohort-research-${{ github.sha }}-${{ github.run_id }}
          path: validation-results
          if-no-files-found: warn
          retention-days: 14
