name: Design-partner interest
description: Volunteer to test Rosalind's builder, workflow, or offline experience
title: "[Design partner] "
labels: ["design-partner"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test Rosalind. This issue is public. Do not include names beyond your GitHub identity, email addresses, employer details, credentials, genomic data, patient information, or private receipts. We will arrange any private follow-up outside this issue.
  - type: dropdown
    id: persona
    attributes:
      label: Testing perspective
      options:
        - Analyzer builder
        - Workflow or HPC team
        - Constrained or offline user
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Both Linux and macOS
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: What would you like to validate?
      description: Describe the workflow without sharing private inputs or organizational details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included credentials, genomic or patient data, private receipts, contact details, or employer-confidential information.
          required: true
