[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
blake3 = "=1.8.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
# toml's open IndexMap range otherwise resolves to releases whose manifest uses
# edition-2024 features that Cargo 1.83 cannot parse, before rustc can enforce MSRV.
indexmap = "=2.7.1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"
